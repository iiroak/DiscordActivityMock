name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean
      tag_name:
        description: 'Release tag (required for manual releases, e.g. v2.2.2)'
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Create global.json to pin SDK version
      shell: pwsh
      run: |
        @"
        {
          "sdk": {
            "version": "8.0.0",
            "rollForward": "latestFeature"
          }
        }
        "@ | Out-File -FilePath global.json -Encoding utf8

    - name: Restore x86 dependencies
      run: dotnet restore DiscordActivityMockV2.csproj -r win-x86

    - name: Build x86
      run: dotnet build DiscordActivityMockV2.csproj -c Release -p:Platform=x86 -p:AssemblyName=DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Portable --no-restore

    - name: Publish portable single-file executable
      shell: pwsh
      run: >-
        dotnet publish DiscordActivityMockV2.csproj -c Release -r win-x86 -p:Platform=x86
        -p:AssemblyName=DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Portable
        -p:PublishReadyToRun=false -p:SelfContained=true -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
        -p:EnableCompressionInSingleFile=true -p:DebugSymbols=false -p:DebugType=None
        --no-restore -o publish/win-x86-single-file

    - name: Publish portable dependency folder
      shell: pwsh
      run: >-
        dotnet publish DiscordActivityMockV2.csproj -c Release -r win-x86 -p:Platform=x86
        -p:AssemblyName=DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Portable
        -p:PublishReadyToRun=false -p:SelfContained=true -p:PublishSingleFile=false
        -p:IncludeNativeLibrariesForSelfExtract=false -p:IncludeAllContentForSelfExtract=false
        -p:DebugSymbols=false -p:DebugType=None --no-restore -o publish/win-x86-folder

    - name: Package portable EXE, ZIP, and installer
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $portableExe = "DiscordActivityMock-${env:RELEASE_TAG}-win-x86-Portable.exe"
        $singleFileExe = Join-Path $env:GITHUB_WORKSPACE "publish\win-x86-single-file\$portableExe"
        $folderPublish = Join-Path $env:GITHUB_WORKSPACE "publish\win-x86-folder"
        $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"

        if (!(Test-Path -LiteralPath $singleFileExe)) { throw "Single-file executable was not produced: $singleFileExe" }
        if (!(Test-Path -LiteralPath (Join-Path $folderPublish $portableExe))) { throw "Folder-publish executable was not produced." }

        New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
        Copy-Item -LiteralPath $singleFileExe -Destination (Join-Path $releaseDirectory $portableExe)
        Compress-Archive -Path (Join-Path $folderPublish '*') -DestinationPath (Join-Path $releaseDirectory "DiscordActivityMock-${env:RELEASE_TAG}-win-x86-Portable.zip") -CompressionLevel Optimal

        choco install innosetup --yes --no-progress
        $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
        if (!(Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
        & $iscc "/DAppVersion=$env:RELEASE_TAG" "/DAppExeName=$portableExe" "/DSourceDir=$folderPublish" "/DOutputDir=$releaseDirectory" (Join-Path $env:GITHUB_WORKSPACE "installer\DiscordActivityMock.iss")
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler exited with code $LASTEXITCODE." }

        $requiredArtifacts = @(
          "DiscordActivityMock-${env:RELEASE_TAG}-win-x86-Setup.exe",
          "DiscordActivityMock-${env:RELEASE_TAG}-win-x86-Portable.zip",
          $portableExe
        )
        foreach ($artifact in $requiredArtifacts) {
          if (!(Test-Path -LiteralPath (Join-Path $releaseDirectory $artifact))) {
            throw "Expected release artifact was not created: $artifact"
          }
        }

    - name: Upload x86 release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DiscordActivityMock-win-x86
        path: release/*
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Validate manual release tag
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      env:
        RELEASE_TAG: ${{ github.event.inputs.tag_name }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "A valid tag such as v2.2.2 is required for a manual release." >&2
          exit 1
        fi
        git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
        tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
        if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
          echo "The selected release tag must point to the exact commit that was built." >&2
          exit 1
        fi

    - name: Download x86 release artifacts
      uses: actions/download-artifact@v4
      with:
        name: DiscordActivityMock-win-x86
        path: release

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        files: |
          release/DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Setup.exe
          release/DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Portable.zip
          release/DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86-Portable.exe
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
