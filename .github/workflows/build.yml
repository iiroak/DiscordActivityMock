name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean
      tag_name:
        description: 'Release tag (required for manual releases, e.g. v2.1.0)'
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: x86
            rid: win-x86
          - platform: ARM64
            rid: win-arm64
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Create global.json to pin SDK version
      run: |
        @"
        {
          "sdk": {
            "version": "8.0.0",
            "rollForward": "latestFeature"
          }
        }
        "@ | Out-File -FilePath global.json -Encoding utf8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore dependencies
      run: dotnet restore DiscordActivityMockV2.csproj -r ${{ matrix.rid }}
      
    - name: Build
      run: |
        dotnet build DiscordActivityMockV2.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore
      
    - name: Publish
      run: |
        # Keep the RID-specific build in publish; --no-build produced a bundle missing System.Runtime.
        dotnet publish DiscordActivityMockV2.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=false -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugSymbols=false -p:DebugType=None -o publish/${{ matrix.rid }}
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiscordActivityMock-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}/
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Validate manual release tag
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.event.inputs.tag_name }}
      run: |
        if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
          throw 'A valid tag such as v2.1.0 is required for a manual release.'
        }
        git fetch --depth=1 origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
        $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
        if ($tagCommit -ne $env:GITHUB_SHA) {
          throw 'The selected release tag must point to the exact commit that was built.'
        }

    - name: Download x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: DiscordActivityMock-win-x64
        path: artifacts/win-x64
        
    - name: Download x86 artifact
      uses: actions/download-artifact@v4
      with:
        name: DiscordActivityMock-win-x86
        path: artifacts/win-x86
        
    - name: Download arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: DiscordActivityMock-win-arm64
        path: artifacts/win-arm64
        
    - name: Package standalone executables and ZIPs
      shell: bash
      run: |
        set -euo pipefail
        for arch in win-x64 win-x86 win-arm64; do
          package="release-package/$arch"
          mkdir -p "$package"
          mv "artifacts/$arch/DiscordActivityMockV2.exe" "artifacts/$arch/DiscordActivityMock-$arch.exe"
          cp -R "artifacts/$arch/." "$package/"
          cp "$package/DiscordActivityMock-$arch.exe" "$GITHUB_WORKSPACE/"
          (cd "$package" && zip -r "$GITHUB_WORKSPACE/DiscordActivityMock-$arch.zip" .)
        done
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        files: |
          DiscordActivityMock-win-x64.exe
          DiscordActivityMock-win-x64.zip
          DiscordActivityMock-win-x86.exe
          DiscordActivityMock-win-x86.zip
          DiscordActivityMock-win-arm64.exe
          DiscordActivityMock-win-arm64.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
