name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean
      tag_name:
        description: 'Release tag (required for manual releases, e.g. v2.1.0)'
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Create global.json to pin SDK version
      shell: pwsh
      run: |
        @"
        {
          "sdk": {
            "version": "8.0.0",
            "rollForward": "latestFeature"
          }
        }
        "@ | Out-File -FilePath global.json -Encoding utf8

    - name: Restore x86 dependencies
      run: dotnet restore DiscordActivityMockV2.csproj -r win-x86

    - name: Build x86
      run: dotnet build DiscordActivityMockV2.csproj -c Release -p:Platform=x86 -p:AssemblyName=DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86 --no-restore

    - name: Publish standalone x86 executable
      shell: pwsh
      run: >-
        dotnet publish DiscordActivityMockV2.csproj -c Release -r win-x86 -p:Platform=x86
        -p:AssemblyName=DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86
        -p:PublishReadyToRun=false -p:SelfContained=true -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
        -p:EnableCompressionInSingleFile=true -p:DebugSymbols=false -p:DebugType=None
        --no-restore -o publish/win-x86

    - name: Verify standalone executable
      shell: pwsh
      run: |
        $expectedExe = "DiscordActivityMock-${env:RELEASE_TAG}-win-x86.exe"
        $exePath = Join-Path $env:GITHUB_WORKSPACE "publish\win-x86\$expectedExe"
        if (!(Test-Path -LiteralPath $exePath)) { throw "Expected x86 executable was not published: $exePath" }

    - name: Upload x86 executable
      uses: actions/upload-artifact@v4
      with:
        name: DiscordActivityMock-win-x86
        path: publish/win-x86/*.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Validate manual release tag
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      env:
        RELEASE_TAG: ${{ github.event.inputs.tag_name }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "A valid tag such as v2.1.0 is required for a manual release." >&2
          exit 1
        fi
        git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
        tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
        if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
          echo "The selected release tag must point to the exact commit that was built." >&2
          exit 1
        fi

    - name: Download x86 executable
      uses: actions/download-artifact@v4
      with:
        name: DiscordActivityMock-win-x86
        path: release

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        files: release/DiscordActivityMock-${{ env.RELEASE_TAG }}-win-x86.exe
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
